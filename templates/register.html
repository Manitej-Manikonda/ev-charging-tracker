<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Driver Registration</title>
<link rel="icon" type="image/png" href="MRUH_no_BG.png">
<style>
  :root { --bg: #080d10; --card: #0f161c; --border: #1e2936; --accent: #b6ff3f; --text: #f0f4f8; --muted: #7e8b9b; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
  .box { background: var(--card); border: 1px solid var(--border); padding: 35px; border-radius: 12px; width: 100%; max-width: 420px; }
  h2 { margin-top: 0; color: #fff; display: flex; align-items: center; gap: 8px; font-size: 22px; }
  h2 span { color: var(--accent); }
  p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .form-group { margin-bottom: 15px; }
  label { display: block; margin-bottom: 6px; font-size: 12px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  input, select { width: 100%; padding: 12px; background: #080d10; border: 1px solid var(--border); border-radius: 6px; color: #fff; box-sizing: border-box; }
  button { width: 100%; padding: 13px; background: var(--accent); color: #080d10; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
  .footer-links { text-align: center; margin-top: 20px; font-size: 13px; color: var(--muted); }
  .err { color: #ff4d4d; font-size: 13px; margin-top: 10px; display: none; }
</style>
</head>
<body>
  <div class="box">
    <h2><span>ϟ</span> Driver Onboarding</h2>
    <p>Register your electric vehicle to receive optimal DAA charging recommendations and route telemetry.</p>
    
    <div class="form-group"><label>Full Name</label><input type="text" id="regName" placeholder="e.g. Alex Mercer" required></div>
    <div class="form-group"><label>Mobile Number (+91)</label><input type="tel" id="regMobile" placeholder="10-digit phone number" required></div>
    
    <!-- THE FIX: Added Number Plate Field -->
    <div class="form-group"><label>Vehicle Number Plate</label><input type="text" id="regPlate" placeholder="e.g. TS 09 EV 1234" required></div>
    
    <div class="form-group"><label>Vehicle Model</label><input type="text" id="regVehicle" placeholder="e.g. Tata Nexon EV"></div>
    <div class="form-group"><label>Battery Capacity (kWh)</label><input type="number" id="regBattery" value="40" step="1"></div>
    
    <button id="submitRegBtn">Register Vehicle & Enter Console</button>
    <div id="regErr" class="err"></div>
    <div class="footer-links">Already have an account? <a href="/login" style="color:var(--accent); font-weight:bold; text-decoration:none;">Sign In</a></div>
  </div>
  <script>
    document.getElementById("submitRegBtn").onclick = async () => {
      const name = document.getElementById("regName").value;
      const mobile = document.getElementById("regMobile").value;
      const license_plate = document.getElementById("regPlate").value; // Grab the plate
      const vehicle_model = document.getElementById("regVehicle").value;
      const battery_capacity = document.getElementById("regBattery").value;
      const errBox = document.getElementById("regErr");
      
      errBox.style.display = "none";
      try {
        const res = await fetch("/api/register", { 
          method: "POST", headers: {"Content-Type": "application/json"}, 
          body: JSON.stringify({ name, mobile, license_plate, vehicle_model, battery_capacity }) 
        });
        const data = await res.json();
        if (data.success) window.location.href = data.redirect;
        else { errBox.textContent = data.message; errBox.style.display = "block"; }
      } catch (e) { errBox.textContent = "Network error. Try again."; errBox.style.display = "block"; }
    };
  </script>
</body>
</html>
