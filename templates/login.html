<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Driver Login</title>
<style>
  :root { --bg: #080d10; --card: #0f161c; --border: #1e2936; --accent: #b6ff3f; --text: #f0f4f8; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .box { background: var(--card); border: 1px solid var(--border); padding: 40px; border-radius: 12px; width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  h2 { margin-top: 0; color: #fff; display: flex; align-items: center; gap: 10px; font-size: 24px; }
  h2 span { color: var(--accent); }
  label { display: block; margin-bottom: 8px; font-size: 12px; text-transform: uppercase; color: #7e8b9b; }
  input { width: 100%; padding: 12px; background: #080d10; border: 1px solid var(--border); border-radius: 6px; color: #fff; margin-bottom: 20px; box-sizing: border-box; }
  button { width: 100%; padding: 14px; background: var(--accent); color: #080d10; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
  .err { color: #ff4d4d; font-size: 13px; margin-top: 10px; display: none; }
  #demoOtpDisplay { text-align: center; color: var(--accent); font-weight: bold; margin-bottom: 15px; font-size: 15px; background: #1a2721; padding: 10px; border-radius: 6px; border: 1px dashed var(--accent); }
</style>
</head>
<body>
  <div class="box">
    <h2><span>ϟ</span> Console Access</h2>
    
    <div id="step1">
      <label>Mobile Number (+91)</label>
      <input type="tel" id="mobile" placeholder="Enter 10-digit number">
      <button id="sendBtn">Send Secure OTP</button>
      <div id="err1" class="err"></div>
      <p style="text-align:center; margin-top:20px; font-size:13px; color:#7e8b9b;">New driver? <a href="/register" style="color:#b6ff3f; text-decoration:none; font-weight:bold;">Register your vehicle</a></p>
    </div>

    <div id="step2" style="display:none;">
      <div id="demoOtpDisplay"></div>
      <label>Enter 6-Digit OTP</label>
      <input type="text" id="otp" placeholder="••••••">
      <button id="verifyBtn">Verify & Launch</button>
      <div id="err2" class="err"></div>
    </div>

  </div>
  
  <script>
    document.getElementById("sendBtn").onclick = async () => {
      const mobile = document.getElementById("mobile").value;
      const err = document.getElementById("err1");
      
      const res = await fetch("/api/login", { 
        method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({mobile}) 
      });
      const data = await res.json();
      
      if(data.success) { 
        document.getElementById("step1").style.display = "none"; 
        document.getElementById("step2").style.display = "block"; 
        // Display the OTP directly in the UI for the demo
        document.getElementById("demoOtpDisplay").textContent = "Demo OTP: " + data.demo_otp;
      } else { 
        err.textContent = data.message; err.style.display = "block"; 
      }
    };

    document.getElementById("verifyBtn").onclick = async () => {
      const mobile = document.getElementById("mobile").value;
      const otp = document.getElementById("otp").value;
      const err = document.getElementById("err2");
      
      const res = await fetch("/api/verify", { 
        method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({mobile, otp}) 
      });
      const data = await res.json();
      
      if(data.success) {
        window.location.href = data.redirect;
      } else { 
        err.textContent = data.message; err.style.display = "block"; 
      }
    };
  </script>
</body>
</html>
